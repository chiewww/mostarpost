name: update Mostar Post

on:
  schedule:
    # Run once every day at 03:15 UTC.
    - cron: "15 3 * * *"

  # Allows you to run it manually from GitHub.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PDF library
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF

      - name: Download PDF and create countries.txt
        run: |
          python monitor.py

      - name: Commit changed countries.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add countries.txt

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update Mostar Post"
            git push
          fi
